<ion-menu contentId="main-content" side="start">
  <ion-header mode="md">
    <ion-toolbar class="bg-white dark:bg-gray-800">
      <ion-title class="text-gold-500 dark:text-green-400 font-bold text-center">Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <div class="text-center px-4 py-6 border-b border-slate-200 dark:border-gray-700 mb-3">
      <div class="w-16 h-16 rounded-full mx-auto mb-3 overflow-hidden border-2 border-gold-400 dark:border-green-500 shadow-sm">
        <img [src]="avatarSrc" alt="avatar" class="w-full h-full object-cover" />
      </div>
      <h3 class="text-lg font-bold text-slate-800 dark:text-gray-100 mb-1">{{ username }}</h3>
      <p *ngIf="isLoggedIn" class="text-xs text-slate-500 dark:text-gray-400">{{ supabase.currentUser?.email }}</p>
      <p *ngIf="!isLoggedIn" routerLink="/login" routerDirection="root"
         class="text-xs font-semibold text-gold-500 dark:text-green-400 cursor-pointer">Login untuk mengakses fitur</p>
    </div>

    <div class="px-3 space-y-1 animate-fade-in-left">
      <button (click)="toggleDarkMode()"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-700 dark:text-gray-200 hover:bg-slate-100 dark:hover:bg-gray-700 transition-all">
        <ion-icon [name]="darkModeIcon" class="text-xl text-slate-400 dark:text-gray-400"></ion-icon>
        <span>{{ darkModeLabel }}</span>
      </button>

      <button (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all">
        <ion-icon name="log-out-outline" class="text-xl text-red-500 dark:text-red-400"></ion-icon>
        <span>Keluar</span>
      </button>
    </div>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header mode="md">
    <ion-toolbar class="bg-white dark:bg-gray-800 border-b border-slate-200 dark:border-gray-700">
      <ion-buttons slot="start">
        <ion-button (click)="openMenu()">
          <ion-icon name="menu-outline" slot="icon-only" class="text-slate-600 dark:text-gray-300"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title class="text-gold-500 dark:text-green-400 font-bold text-lg text-center">Lughaty Digital</ion-title>
      <ion-buttons slot="end">
        <ion-button (click)="toggleDarkMode()">
          <ion-icon [name]="darkModeIcon" slot="icon-only" class="text-slate-600 dark:text-gray-300"></ion-icon>
        </ion-button>
        <ion-button (click)="logout()">
          <ion-icon name="log-out-outline" slot="icon-only" class="text-slate-600 dark:text-gray-300"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <!-- Greeting -->
    <div class="px-4 pt-6 pb-2 text-center animate-fade-in-up">
      <p class="text-lg font-arabic text-gold-400 mb-0.5">{{ arabicGreeting }}</p>
      <h2 class="text-xl font-extrabold text-slate-800 dark:text-white">{{ greeting }}, {{ username }}</h2>
      <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Aplikasi Penyiaran Islam Digital</p>
    </div>

    <!-- Grid Cards -->
    <div class="main_container animate-fade-in-up" style="animation-delay: 80ms">
      <div class="parent">
        <button *ngFor="let m of menus; let i = index" class="dashboard-card" [attr.data-color]="i" [routerLink]="m.route">
          <ion-icon [name]="m.icon" class="card-icon"></ion-icon>
          <span class="card-label">{{ m.title }}</span>
        </button>
      </div>
    </div>

    <!-- Footer Quote -->
    <div class="mx-4 mt-5 mb-6 p-4 bg-slate-800/60 dark:bg-white/80 backdrop-blur-sm rounded-2xl text-center animate-fade-in-up" style="animation-delay: 300ms">
      <p class="text-xs text-slate-400 dark:text-slate-600 italic leading-relaxed">
        "Sampaikanlah dariku walau hanya satu ayat" (HR. Bukhari)
      </p>
    </div>
  </ion-content>
</div>
