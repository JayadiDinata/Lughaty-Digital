<ion-header class="app-header">
  <ion-toolbar class="bg-white dark:bg-gray-800 border-b border-slate-200 dark:border-gray-700">
    <ion-buttons slot="start">
      <div routerLink="/tabs/home" routerDirection="root"
        class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-gray-700 text-slate-500 dark:text-gray-400 transition-all">
        <ion-icon name="home-outline" class="text-xl"></ion-icon>
      </div>
    </ion-buttons>
    <ion-title class="text-gold-500 dark:text-green-400 font-bold text-lg">Islamic Education</ion-title>
    <ion-buttons slot="end">
      <div (click)="toggleDarkMode()"
        class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-gray-700 text-slate-500 dark:text-gray-400 transition-all">
        <ion-icon [name]="darkModeIcon" class="text-xl"></ion-icon>
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="[--background:#f5f7fa] dark:[--background:#0f172a]">
  <div class="px-4 py-5 max-w-[600px] mx-auto">
    <!-- Header -->
    <div class="text-center mb-5 animate-fade-in-up">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-green-600 dark:from-emerald-600 dark:to-green-700 flex items-center justify-center mx-auto mb-3 shadow-lg">
        <ion-icon name="school-outline" class="text-3xl text-white"></ion-icon>
      </div>
      <h1 class="text-xl font-extrabold text-slate-800 dark:text-gray-100">Pendidikan Islam</h1>
      <p class="text-xs text-slate-500 dark:text-gray-400 mt-1">Pilih channel untuk menonton video</p>
    </div>

    <!-- Channel Selector -->
    <div class="flex gap-2 mb-4 animate-fade-in-up" style="animation-delay: 40ms">
      <button *ngFor="let ch of channels"
        (click)="selectChannel(ch.id)"
        class="flex-1 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all border-2"
        [class.bg-emerald-500]="activeChannel === ch.id"
        [class.text-white]="activeChannel === ch.id"
        [class.border-emerald-500]="activeChannel === ch.id"
        [class.bg-white]="activeChannel !== ch.id"
        [class.dark:bg-gray-800]="activeChannel !== ch.id"
        [class.text-slate-600]="activeChannel !== ch.id"
        [class.dark:text-gray-300]="activeChannel !== ch.id"
        [class.border-slate-200]="activeChannel !== ch.id"
        [class.dark:border-gray-600]="activeChannel !== ch.id">
        {{ ch.name }}
      </button>
    </div>

    <!-- Channel Embed -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden shadow-sm dark:shadow-md animate-fade-in-up" style="animation-delay: 80ms">
      <div class="relative pb-[56.25%] bg-slate-900">
        <iframe [src]="playlistUrl | safeUrl"
          class="absolute inset-0 w-full h-full"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
      <div class="p-4">
        <h3 class="text-sm font-bold text-slate-800 dark:text-gray-100 mb-1">{{ active.name }}</h3>
        <p class="text-xs text-slate-500 dark:text-gray-400 leading-relaxed">
          {{ active.desc }}
        </p>
        <a [href]="active.url" target="_blank"
          class="inline-flex items-center gap-1.5 mt-3 px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-full transition-all">
          <ion-icon name="logo-youtube" class="text-base"></ion-icon>
          Kunjungi Channel
        </a>
      </div>
    </div>

    <!-- Footer Note -->
    <div class="text-center mt-6 mb-4 text-[10px] text-slate-400 dark:text-gray-600">
      Klik playlist di sudut kiri atas video untuk melihat semua video
    </div>
  </div>
</ion-content>
